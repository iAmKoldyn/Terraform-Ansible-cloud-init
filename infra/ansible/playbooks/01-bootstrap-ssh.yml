---
- name: Enforce key-only SSH access
  hosts: all
  become: true
  tasks:
    - name: Ensure naurlox user exists
      ansible.builtin.user:
        name: naurlox
        groups: sudo,docker
        append: true
        shell: /bin/bash

    - name: Ensure naurlox SSH directory exists
      ansible.builtin.file:
        path: /home/naurlox/.ssh
        state: directory
        owner: naurlox
        group: naurlox
        mode: "0700"

    - name: Enforce SSH hardening config
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
      notify: Restart ssh

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
