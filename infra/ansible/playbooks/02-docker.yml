---
- name: Install Docker engine
  hosts: all
  become: true
  tasks:
    - name: Remove conflicting Docker CE packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: absent
        purge: true
        autoremove: true
      ignore_errors: true

    - name: Refresh apt cache and install docker package
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-pip
        state: present
        update_cache: true

    - name: Ensure docker service is enabled and started
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Ensure naurlox user is in docker group
      ansible.builtin.user:
        name: naurlox
        groups: docker
        append: true
